<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>测试仓库 · 静态页面</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 页面主标题区 -->
    <header class="page-header">
      <h1>多语言示例仓库</h1>
      <p class="page-header__subtitle">用于验证 git 对各类文件的追踪与差异展示</p>
    </header>

    <!-- 内容区：列出仓库覆盖的文件类型 -->
    <main class="content">
      <section class="card">
        <!-- 区块标题 -->
        <h2>覆盖范围</h2>
        <!-- 文件类型清单 -->
        <ul class="tag-list">
          <li>编程语言</li>
          <li>配置文件</li>
          <li>数据文件</li>
          <li>文档</li>
        </ul>
      </section>

      <section class="card">
        <!-- 区块标题 -->
        <h2>说明</h2>
        <p>页面无外部依赖，直接用浏览器打开即可预览。</p>
      </section>
    </main>
  </body>
</html>
